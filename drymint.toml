# Generated by `drymint repo init`.
# TODO: Review generated [index].ignore and language domain defaults.
# Remove or adjust patterns that do not match this repository.

version = "v0"

[index]
# Keep indexing deterministic and low-noise for local dev.
ignore = [
  "**/.gradle/**",
  "**/.pytest_cache/**",
  "**/.venv/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/node_modules/**",
  "**/target/**",
  "**/vendor/**",
  "**/venv/**",
  ".drymint/**",
  ".git/**",
  ".gradle/**",
  ".pytest_cache/**",
  ".venv/**",
  "__pycache__/**",
  "build/**",
  "dist/**",
  "node_modules/**",
  "target/**",
  "vendor/**",
  "venv/**",
]

[plugins.go]
enabled = true

[languages.go.domains]
rules = [
  # Reusable server framework.
  { domain = "tests", source_roles = ["test"], match = ["oversync/**/*_test.go"] },
  { domain = "main", match = ["oversync/**/*.go"] },

  # Reusable Go/SQLite client framework.
  { domain = "oversqlite_tests", source_roles = ["test"], match = ["oversqlite/**/*_test.go"] },
  { domain = "oversqlite", match = ["oversqlite/**/*.go"] },

  # Cross-library PostgreSQL/SQLite end-to-end suite.
  { domain = "oversqlite_e2e", source_roles = ["test"], match = ["oversqlite_e2e/**/*_test.go"] },

  # Shared support used by the example applications.
  { domain = "example_support", source_roles = ["example"], match = ["examples/internal/**/*.go"] },

  # Reference net/http server application.
  { domain = "nethttp_server_tests", source_roles = ["test", "example"], match = ["examples/nethttp_server/**/*_test.go"] },
  { domain = "nethttp_server", source_roles = ["example"], match = ["examples/nethttp_server/**/*.go"] },

  # Sample server for the SQLiteNow KMP sample application.
  { domain = "samplesync_server", source_roles = ["example"], match = ["examples/samplesync_server/**/*.go"] },

  # Standalone mobile-flow module and simulator application.
  { domain = "mobile_flow_tests", source_roles = ["test", "example"], match = ["examples/mobile_flow/**/*_test.go"] },
  { domain = "mobile_flow", source_roles = ["example"], match = ["examples/mobile_flow/**/*.go"] },

  # Repository-level informational CLI.
  { domain = "repo_cli", source_roles = ["example"], match = ["main.go"] },
]
